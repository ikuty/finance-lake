name: edinet-dl - Build and push image

# 設計: services/edinet-dl/docs/deployment_design.md
# services/edinet-dl/配下の変更をmainにpushした際に自動実行。Mac Miniの稼働状態に依存しない
# ビルド＆push工程のみを担う。Mac Miniへの反映は edinet-dl-deploy.yml（手動トリガー）で別途行う。

on:
  push:
    branches: [main]
    paths:
      - services/edinet-dl/**
      - .github/workflows/edinet-dl-build-push.yml

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/edinet-dl
          file: services/edinet-dl/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/edinet-dl:latest

# パッケージ（edinet-dl）は公開リポジトリに紐づくため、GITHUB_TOKENでのpush時点で
# 自動的にPublicになる（手動での可視性切り替えは不要だった。2026-08-26に実機確認済み。
# docs/deployment_design.md「ghcr.ioの認証」参照）。
