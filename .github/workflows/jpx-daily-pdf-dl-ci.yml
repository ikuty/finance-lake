name: jpx-daily-pdf-dl - CI

# push（main）と pull_request で実行。finance-dwh-ci.ymlと同じ構成
# （mypy --strict + pytest）をfinance-lakeの各サービスにも導入する（2026-10-17）。
# Mac Miniには依存しない。build-push.yml（イメージのビルド＆push）とは別の
# ワークフローとして分離し、pathsフィルタでservices/jpx-daily-pdf-dl/配下の変更のみに絞る。

on:
  push:
    branches: [main]
    paths:
      - services/jpx-daily-pdf-dl/**
      - .github/workflows/jpx-daily-pdf-dl-ci.yml
  pull_request:
    paths:
      - services/jpx-daily-pdf-dl/**
      - .github/workflows/jpx-daily-pdf-dl-ci.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/jpx-daily-pdf-dl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/jpx-daily-pdf-dl/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: mypy --strict
        run: mypy

      - name: pytest
        run: pytest -q
