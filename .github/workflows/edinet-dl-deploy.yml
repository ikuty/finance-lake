name: edinet-dl - Deploy to Mac Mini

# 設計: services/edinet-dl/docs/deployment_design.md
# workflow_dispatch による手動トリガーのみ。Mac Miniは電源スケジュールで稼働時間が
# 限られているため、電源投入・Tailscale経由での到達性をユーザーが確認してから実行すること。
#
# 事前準備（未設定の場合はこのワークフローは失敗する）:
#   - Tailscale管理画面でOAuthクライアントを作成し、Secrets に
#     TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET を設定する
#   - Mac MiniへSSH接続するための秘密鍵を Secrets の SSH_PRIVATE_KEY に設定する
#     （対応する公開鍵をMac Miniの ~/.ssh/authorized_keys に登録しておく）
#   - MAC_MINI_HOST（Tailscaleホスト名）、MAC_MINI_USER（SSHユーザー名）を
#     Secrets またはこのファイル内の環境変数として設定する

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Pull latest image on Mac Mini
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MAC_MINI_HOST }}
          username: ${{ secrets.MAC_MINI_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # edinet-dl.serviceは`edinet-dl:latest`という（レジストリ接頭辞の無い）ローカルタグを
          # 参照しているため、pull後に同じタグへ付け替える。付け替えを忘れるとpullが成功しても
          # 実際に動くイメージは更新されない（2026-08-27に実機で確認済みの不具合）。
          script: |
            docker pull ghcr.io/${{ github.repository_owner }}/edinet-dl:latest
            docker tag ghcr.io/${{ github.repository_owner }}/edinet-dl:latest edinet-dl:latest
            # 旧イメージは、同じタグを付け替えた時点でタグが外れて dangling(<none>)になり、デプロイの
            # たびに溜まる(mufg-corporate-actionsは約3.65GB)。付け替えの後に回収する。-a は付けない
            # (日次のsystemdタイマーが使う:latestのイメージは残す。停止中のコンテナが使うイメージも
            # pruneが除外する)。回収の失敗はデプロイの成否と無関係なので警告にとどめる。
            docker image prune -f || echo "::warning::docker image prune に失敗(デプロイ自体は完了している)"

# docker run --rm 方式（コンテナ内にデーモンを置かない）のため、pull後の再起動や
# サービス再読み込みは不要。次回のsystemdタイマー実行から新しいイメージが使われる。
