name: mufg-corporate-actions - CI

# push（main）と pull_request で実行。finance-dwh-ci.ymlと同じ構成
# （mypy --strict + pytest）をfinance-lakeの各サービスにも導入する（2026-10-17）。
# Mac Miniには依存しない。build-push.yml（イメージのビルド＆push）とは別の
# ワークフローとして分離し、pathsフィルタでservices/mufg-corporate-actions/配下の
# 変更のみに絞る。
#
# playwrightはrequirements.txtに含まれるが、ブラウザ本体（Chromium等）の
# インストールは不要（実機確認: ユニットテストはplaywright.sync_apiの例外型等を
# 参照するのみで、実際にブラウザを起動しない）。

on:
  push:
    branches: [main]
    paths:
      - services/mufg-corporate-actions/**
      - .github/workflows/mufg-corporate-actions-ci.yml
  pull_request:
    paths:
      - services/mufg-corporate-actions/**
      - .github/workflows/mufg-corporate-actions-ci.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mufg-corporate-actions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/mufg-corporate-actions/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: mypy --strict
        run: mypy

      - name: pytest
        run: pytest -q
