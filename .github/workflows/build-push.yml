name: Build and push image

# 設計: docs/deployment_design.md
# main へのpushで自動実行。Mac Miniの稼働状態に依存しないビルド＆push工程のみを担う。
# Mac Miniへの反映は deploy.yml（手動トリガー）で別途行う。

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/edinet-dl:latest

# パッケージ（edinet-dl）は公開リポジトリに紐づくため、GITHUB_TOKENでのpush時点で
# 自動的にPublicになる（手動での可視性切り替えは不要だった。2026-08-26に実機確認済み。
# docs/deployment_design.md「ghcr.ioの認証」参照）。
