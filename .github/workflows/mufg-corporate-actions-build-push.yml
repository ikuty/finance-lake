name: mufg-corporate-actions - Build and push image

# 設計: services/mufg-corporate-actions/CLAUDE.md
# services/mufg-corporate-actions/配下の変更をmainにpushした際に自動実行。Mac Miniの
# 稼働状態に依存しないビルド＆push工程のみを担う。Mac Miniへの反映は
# mufg-corporate-actions-deploy.yml（手動トリガー）で別途行う。

on:
  push:
    branches: [main]
    paths:
      - services/mufg-corporate-actions/**
      - .github/workflows/mufg-corporate-actions-build-push.yml

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/mufg-corporate-actions
          file: services/mufg-corporate-actions/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mufg-corporate-actions:latest
