name: jpx-daily-pdf-dl - Deploy to Mac Mini

# 設計: services/jpx-daily-pdf-dl/docs/file_download_design.md
# workflow_dispatch による手動トリガーのみ。Mac Miniは電源スケジュールで稼働時間が
# 限られているため、電源投入・Tailscale経由での到達性をユーザーが確認してから実行すること。
#
# Secrets・事前準備は edinet-dl-deploy.yml と共通（Tailscale OAuthクライアント、
# SSH_PRIVATE_KEY、MAC_MINI_HOST、MAC_MINI_USER）。
#
# バックフィル進捗レポートの生成・S3アップロード・Slack通知は、以前このワークフロー
# （手動トリガーのデプロイ時のみ実行）が担っていたが、2026-09-06に廃止した。
# GitHub Actions以外の経路で結果を確認できない（GitHubへのログインが無いと
# Artifactを見られない）という設計上の問題があったため。現在はサービス本体
# （fetch_jpx_daily.py、日次実行のたびにS3へアップロードしSlackへ通知）が担う。
# 詳細はservices/jpx-daily-pdf-dl/docs/file_download_design.md
# 「バックフィル進捗レポートの公開（S3）」参照。

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Pull latest image and sync repo checkout on Mac Mini
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MAC_MINI_HOST }}
          username: ${{ secrets.MAC_MINI_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # jpx-daily-pdf-dl.serviceは`jpx-daily-pdf-dl:latest`という（レジストリ接頭辞の
          # 無い）ローカルタグを参照しているため、pull後に同じタグへ付け替える
          # （edinet-dlで実機確認済みの同種の不具合を踏まえた対応）。
          #
          # git pullも併せて行う。Mac Mini上で直接python3実行するスクリプト
          # （backfill_confirmed_archive.py等の使い捨てスクリプト）や、ユーザーが
          # 手動操作で参照するチェックアウトを最新に保つため。detached HEADには
          # せずmainブランチのままfast-forwardする。
          script: |
            cd /home/${{ secrets.MAC_MINI_USER }}/finance-lake
            git checkout main
            git pull origin main
            docker pull ghcr.io/${{ github.repository_owner }}/jpx-daily-pdf-dl:latest
            docker tag ghcr.io/${{ github.repository_owner }}/jpx-daily-pdf-dl:latest jpx-daily-pdf-dl:latest

# docker run --rm 方式（コンテナ内にデーモンを置かない）のため、pull後の再起動や
# サービス再読み込みは不要。次回のsystemdタイマー実行から新しいイメージが使われる。
