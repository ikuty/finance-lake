name: Gitleaks

# 設計: services/edinet-dl/docs/deployment_design.md「秘密情報の継続的なチェック（gitleaks）」
# main へのpushと、pull_request（featureブランチ→devのPR等）で実行。公開リポジトリのため
# 無料で動作し、追加の認証情報は不要。
# 過去履歴の遡及スキャンは行わない（2026-08-25の初回コミット以降のみ対象で十分）。
#
# pull_requestでも実行する理由（2026-11-14判明）: リリースはrelease→mainのmerge commitで
# mainに入るため、gitleaks-actionがpush範囲に使う`git log --no-merges --first-parent`では
# merge commitしか出ず、mainへのpushでは常に「0 commits scanned」になる（スキャンされない）。
# 実際のコミットはPR（feature→dev）に現れるので、PRのコミットをスキャンする。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth未指定(既定1)だと、gitleaks-actionがpush前後のコミット範囲をgit logで
      # スキャンする際に「push前」のコミットが浅いcloneに含まれておらず、unknown revisionで
      # 失敗する(2026-11-14に判明。10-31以降のmainへのpushで毎回失敗し、スキャンされたのは
      # 約0バイトの「partial scan」だった=秘密情報のチェックが実質行われていなかった)。
      # finance-dwhは2026-09-22に同じ原因で修正済み。個人プロジェクトの規模のため全履歴
      # 取得(fetch-depth: 0)で問題ない。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
