name: ir-disclosure-dl - Deploy to Mac Mini

# 設計: services/ir-disclosure-dl/CLAUDE.md
# workflow_dispatch による手動トリガーのみ。Mac Miniは電源スケジュールで稼働時間が
# 限られているため、電源投入・Tailscale経由での到達性をユーザーが確認してから実行すること。
#
# 事前準備（未設定の場合はこのワークフローは失敗する）:
#   - Tailscale管理画面でOAuthクライアントを作成し、Secrets に
#     TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET を設定する（Auth Keysスコープ、Write権限。
#     Devices Coreスコープでは`tailscale up`が権限不足で失敗する。2026-09-15実機確認）
#   - Mac MiniへSSH接続するための秘密鍵を Secrets の SSH_PRIVATE_KEY に設定する
#     （対応する公開鍵をMac Miniの ~/.ssh/authorized_keys に登録しておく）
#   - MAC_MINI_HOST（Tailscaleホスト名）、MAC_MINI_USER（SSHユーザー名）を
#     Secrets またはこのファイル内の環境変数として設定する
#
# 上記のTailscale/SSH secretsは他サービスのdeployワークフローと共有する
# （リポジトリ単位で1組のみ設定すればよい）。

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Pull latest image on Mac Mini
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MAC_MINI_HOST }}
          username: ${{ secrets.MAC_MINI_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # ir-disclosure-dl.serviceは`ir-disclosure-dl:latest`という（レジストリ
          # 接頭辞の無い）ローカルタグを参照しているため、pull後に同じタグへ
          # 付け替える（edinet-dl/jpx-daily-pdf-dl/mufg-corporate-actionsで
          # 実機確認済みの不具合対策）。
          script: |
            docker pull ghcr.io/${{ github.repository_owner }}/ir-disclosure-dl:latest
            docker tag ghcr.io/${{ github.repository_owner }}/ir-disclosure-dl:latest ir-disclosure-dl:latest

# docker run --rm 方式（コンテナ内にデーモンを置かない）のため、pull後の再起動や
# サービス再読み込みは不要。次回のsystemdタイマー実行から新しいイメージが使われる。
